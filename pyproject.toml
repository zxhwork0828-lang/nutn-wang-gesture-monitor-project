[project]
name = "item3"
version = "0.1.0"
description = "電腦視覺與資料視覺化專案（含手勢映廊 FastAPI Web 應用、OpenCV 與 YOLOv8 Notebooks）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencv-python-headless>=4.13,<5",
    "pandas>=2.3.3",
    "pydantic>=2.12,<3.0",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "ultralytics>=8.4.123",
    "uvicorn>=0.30,<1.0",
    "xgboost>=3.2.0",
]

[project.scripts]
item3 = "item3:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
